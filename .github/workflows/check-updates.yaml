# ──────────────────────────────────────────────────────────────────────────────
# check-updates.yaml — Weekly check for newer upstream plugin versions
#
# Per contracts/ci-workflows.md § Workflow 3:
#   - For each plugin in plugins.yaml, query the upstream repo for the latest tag
#   - If a newer version exists, update the manifest and open a PR
# ──────────────────────────────────────────────────────────────────────────────
name: Check Upstream Updates

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    name: Check for upstream plugin updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check for updates
        id: check
        run: |
          set -euo pipefail

          MANIFEST="plugins.yaml"
          UPDATES=""
          CHANGELOG=""
          PLUGIN_COUNT=$(yq '.plugins | length' "$MANIFEST")

          for i in $(seq 0 $((PLUGIN_COUNT - 1))); do
            NAME=$(yq ".plugins[$i].name" "$MANIFEST")
            KIND=$(yq ".plugins[$i].kind" "$MANIFEST")
            CURRENT_VERSION=$(yq ".plugins[$i].version" "$MANIFEST")
            REPO=$(yq ".plugins[$i].upstream.repo" "$MANIFEST")
            CURRENT_TAG=$(yq ".plugins[$i].upstream.tag" "$MANIFEST")

            echo "Checking ${NAME} (current: ${CURRENT_VERSION})..."

            # Derive the tag pattern from the current tag
            # e.g., plugins-destination-s3-v7.10.2 → plugins-destination-s3-v
            TAG_PREFIX="${CURRENT_TAG%-*}-"
            TAG_PREFIX="${TAG_PREFIX%v*}v"

            # Fetch all matching tags from upstream
            LATEST_TAG=$(git ls-remote --tags --sort=-v:refname "$REPO" "${TAG_PREFIX}*" 2>/dev/null \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -v '\^{}' \
              | head -1)

            if [[ -z "$LATEST_TAG" ]]; then
              echo "  No tags found matching pattern ${TAG_PREFIX}*"
              continue
            fi

            if [[ "$LATEST_TAG" == "$CURRENT_TAG" ]]; then
              echo "  Up to date ✓"
              continue
            fi

            # Extract version from tag (e.g., plugins-destination-s3-v7.11.0 → v7.11.0)
            LATEST_VERSION="${LATEST_TAG##*-}"

            # Resolve the new tag to a commit SHA
            NEW_COMMIT=$(git ls-remote --tags "$REPO" "$LATEST_TAG" 2>/dev/null | awk '{print $1}' | head -1)

            if [[ -z "$NEW_COMMIT" ]]; then
              echo "  Warning: could not resolve commit for ${LATEST_TAG}"
              continue
            fi

            echo "  Update available: ${CURRENT_VERSION} → ${LATEST_VERSION} (tag: ${LATEST_TAG})"

            # Update the manifest in place
            yq -i ".plugins[$i].version = \"${LATEST_VERSION}\"" "$MANIFEST"
            yq -i ".plugins[$i].upstream.tag = \"${LATEST_TAG}\"" "$MANIFEST"
            yq -i ".plugins[$i].upstream.commit = \"${NEW_COMMIT}\"" "$MANIFEST"

            UPDATES="true"
            CHANGELOG="${CHANGELOG}- **${NAME}**: ${CURRENT_VERSION} → ${LATEST_VERSION}\n"
          done

          echo "has_updates=${UPDATES:-false}" >> "$GITHUB_OUTPUT"

          if [[ -n "$UPDATES" ]]; then
            {
              echo "changelog<<EOF"
              echo -e "$CHANGELOG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DATE=$(date +%Y-%m-%d)
          BRANCH="update/plugins-${DATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add plugins.yaml
          git commit -m "chore: update plugin versions (${DATE})"
          git push origin "$BRANCH"

          PR_BODY=$(cat <<'BODY'
          ## Upstream Plugin Updates

          The following plugins have newer versions available:

          ${{ steps.check.outputs.changelog }}

          ### Checklist

          - [ ] Review version changes above
          - [ ] CI passes (schema validation + build + smoke test)
          - [ ] No breaking changes in upstream release notes

          ---
          *Automatically generated by the [check-updates](.github/workflows/check-updates.yaml) workflow.*
          BODY
          )

          gh pr create \
            --title "chore: update plugin versions (${DATE})" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --label "dependencies"
