# ──────────────────────────────────────────────────────────────────────────────
# update-go-version.yaml — Weekly update of Go toolchain version in plugins.yaml
#
# Fetches the latest stable Go release ≥2 weeks old, updates all go_version
# fields in the manifest, validates, and opens a PR.
# ──────────────────────────────────────────────────────────────────────────────
name: Update Go Version

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-go-version:
    name: Check and update Go version
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install dependencies
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check current Go version
        id: current
        run: |
          CURRENT=$(yq '.plugins[0].build.go_version' plugins.yaml)
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Current Go version: ${CURRENT}"

      - name: Update Go version
        id: update
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CI: "true"
        run: |
          ./scripts/update-go-version.sh
          NEW=$(yq '.plugins[0].build.go_version' plugins.yaml)
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          if [[ "$NEW" != "${{ steps.current.outputs.version }}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manifest
        if: steps.update.outputs.changed == 'true'
        run: make validate

      - name: Create Pull Request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: "chore: update Go version to ${{ steps.update.outputs.version }}"
          branch: update/go-version-${{ github.run_id }}
          delete-branch: true
          commit-message: |
            chore: update Go version to ${{ steps.update.outputs.version }}

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          body: |
            ## Go Version Update

            Updated `go_version` for all plugins: ${{ steps.current.outputs.version }} → ${{ steps.update.outputs.version }}

            **Release**: go${{ steps.update.outputs.version }}
            **Release notes**: https://go.dev/doc/go${{ steps.update.outputs.version }}

            ---
            *Automatically generated by the [update-go-version](.github/workflows/update-go-version.yaml) workflow.*
          labels: dependencies
