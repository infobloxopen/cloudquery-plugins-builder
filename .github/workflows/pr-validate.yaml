name: PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins.yaml'
      - 'Dockerfile'
      - 'cmd/entrypoint/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'schemas/**'

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─── Step 1: Validate manifest schema and upstream refs ───────────────────
  validate:
    name: Validate Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        shell: bash
        run: |
          pip install check-jsonschema
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate manifest
        shell: bash
        run: |
          chmod +x scripts/validate-manifest.sh
          ./scripts/validate-manifest.sh

  # ─── Step 2: Generate matrix from validated manifest ──────────────────────
  generate-matrix:
    name: Generate Matrix
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yq
        uses: mikefarah/yq@8bf425b4d1344db7cd469a8d10a390876e0c77fd # v4.45.4

      - name: Generate matrix
        id: matrix
        shell: bash
        run: |
          chmod +x scripts/generate-matrix.sh
          MATRIX=$(./scripts/generate-matrix.sh)
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  # ─── Step 3: Build and smoke test each plugin (no push) ───────────────────
  build-and-test:
    name: Build ${{ matrix.name }} ${{ matrix.version }}
    needs: [generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Test all plugins even if one fails
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and test plugin
        uses: ./.github/actions/build-plugin
        with:
          name: ${{ matrix.name }}
          kind: ${{ matrix.kind }}
          version: ${{ matrix.version }}
          upstream_repo: ${{ matrix.upstream_repo }}
          upstream_tag: ${{ matrix.upstream_tag }}
          upstream_commit: ${{ matrix.upstream_commit }}
          plugin_dir: ${{ matrix.plugin_dir }}
          go_version: ${{ matrix.go_version }}
          bin_name: ${{ matrix.bin_name }}
          ldflags_version_path: ${{ matrix.ldflags_version_path }}
          cgo_required: ${{ matrix.cgo_required }}
          push: 'false'
          smoke_test: 'true'

  # ─── Summary ─────────────────────────────────────────────────────────────
  summary:
    name: PR Summary
    needs: [validate, generate-matrix, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yq
        uses: mikefarah/yq@8bf425b4d1344db7cd469a8d10a390876e0c77fd # v4.45.4

      - name: Generate job summary
        shell: bash
        run: |
          echo "## PR Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Validation status
          VALIDATE_STATUS="${{ needs.validate.result }}"
          if [[ "$VALIDATE_STATUS" == "success" ]]; then
            echo "### ✅ Manifest Validation: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Manifest Validation: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Schema validation or upstream ref verification failed." >> "$GITHUB_STEP_SUMMARY"
            echo "> Check the **Validate Manifest** job logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Build status table
          echo "### Build & Smoke Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Plugin | Version | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|---------|--------|" >> "$GITHUB_STEP_SUMMARY"

          # Read plugin list from manifest
          PLUGIN_COUNT=$(yq '.plugins | length' plugins.yaml 2>/dev/null || echo "0")
          BUILD_STATUS="${{ needs.build-and-test.result }}"

          for i in $(seq 0 $((PLUGIN_COUNT - 1))); do
            NAME=$(yq ".plugins[$i].name" plugins.yaml)
            VERSION=$(yq ".plugins[$i].version" plugins.yaml)
            if [[ "$BUILD_STATUS" == "success" ]]; then
              echo "| ${NAME} | ${VERSION} | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$BUILD_STATUS" == "failure" ]]; then
              echo "| ${NAME} | ${VERSION} | ❌ Check logs |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${NAME} | ${VERSION} | ⏭️ Skipped |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Pipeline diagram
          echo "### Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Schema Validation → Upstream Ref Check → Image Build → Smoke Test" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check results
        shell: bash
        run: |
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "::error::Manifest validation failed — check the Validate Manifest job for details"
            exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::One or more plugin builds/tests failed — check individual build jobs for details"
            exit 1
          fi
          echo "✅ All validations passed"
