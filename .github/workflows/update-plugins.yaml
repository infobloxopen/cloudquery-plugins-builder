# ──────────────────────────────────────────────────────────────────────────────
# update-plugins.yaml — Daily automated check for newer destination plugin versions
#
# Runs the update-plugins.sh script which queries the Infoblox fork for the
# latest stable release tags, updates plugins.yaml, validates, and opens a PR.
# ──────────────────────────────────────────────────────────────────────────────
name: Update Plugin Versions

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-plugins:
    name: Check and update plugin versions
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install dependencies
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check for updates (dry-run)
        id: check
        run: |
          OUTPUT=$(./scripts/update-plugins.sh --dry-run 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "UPDATE AVAILABLE"; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply updates
        if: steps.check.outputs.has_updates == 'true'
        run: ./scripts/update-plugins.sh

      - name: Validate manifest
        if: steps.check.outputs.has_updates == 'true'
        run: make validate

      - name: Detect new plugins
        if: always()
        id: detect
        run: |
          OUTPUT=$(./scripts/detect-new-plugins.sh 2>&1)
          echo "$OUTPUT"
          {
            echo "detection<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: "chore: update plugin versions"
          branch: update/plugins-${{ github.run_id }}
          delete-branch: true
          commit-message: |
            chore: update plugin versions

            Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          body: |
            ## Plugin Version Updates

            Updated destination plugin versions to the latest stable releases from the Infoblox fork.

            ### New Plugin Detection

            ```
            ${{ steps.detect.outputs.detection }}
            ```

            ---
            *Automatically generated by the [update-plugins](.github/workflows/update-plugins.yaml) workflow.*
          labels: dependencies
