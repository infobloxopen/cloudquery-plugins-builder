name: Publish Plugin Images

on:
  push:
    branches: [main]
    paths:
      - 'plugins.yaml'
      - 'Dockerfile'
      - 'cmd/entrypoint/**'
      - 'scripts/**'
      - '.github/workflows/publish.yaml'
      - '.github/actions/build-plugin/**'

permissions:
  contents: write
  packages: write
  id-token: write  # Required for cosign OIDC keyless signing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel publishes

jobs:
  # ─── Generate build matrix from plugins.yaml ──────────────────────────────
  generate-matrix:
    name: Generate Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yq
        uses: mikefarah/yq@8bf425b4d1344db7cd469a8d10a390876e0c77fd # v4.45.4

      - name: Generate matrix
        id: matrix
        shell: bash
        run: |
          chmod +x scripts/generate-matrix.sh
          MATRIX=$(./scripts/generate-matrix.sh)
          echo "result=${MATRIX}" >> "$GITHUB_OUTPUT"

  # ─── Validate manifest before building ────────────────────────────────────
  validate:
    name: Validate Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        shell: bash
        run: |
          pip install check-jsonschema
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate manifest
        shell: bash
        run: |
          chmod +x scripts/validate-manifest.sh
          ./scripts/validate-manifest.sh

  # ─── Build and push each plugin image ─────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.name }} ${{ matrix.version }}
    needs: [generate-matrix, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # One failure should not block other plugins
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and push plugin
        uses: ./.github/actions/build-plugin
        with:
          name: ${{ matrix.name }}
          kind: ${{ matrix.kind }}
          version: ${{ matrix.version }}
          upstream_repo: ${{ matrix.upstream_repo }}
          upstream_tag: ${{ matrix.upstream_tag }}
          upstream_commit: ${{ matrix.upstream_commit }}
          plugin_dir: ${{ matrix.plugin_dir }}
          go_version: ${{ matrix.go_version }}
          bin_name: ${{ matrix.bin_name }}
          ldflags_version_path: ${{ matrix.ldflags_version_path }}
          push: 'true'
          cosign_sign: 'true'
          smoke_test: 'true'

      - name: Export build metadata
        shell: bash
        run: |
          mkdir -p /tmp/build-metadata
          cat > "/tmp/build-metadata/${{ matrix.name }}.json" << 'EOF'
          {
            "plugin_kind": "${{ matrix.kind }}",
            "plugin_name": "${{ matrix.name }}",
            "version": "${{ matrix.version }}",
            "image": "ghcr.io/${{ github.repository_owner }}/cloudquery-plugin-${{ matrix.name }}:${{ matrix.version }}",
            "upstream_repo": "${{ matrix.upstream_repo }}",
            "upstream_tag": "${{ matrix.upstream_tag }}",
            "upstream_commit": "${{ matrix.upstream_commit }}",
            "build_timestamp": "${{ github.event.head_commit.timestamp }}"
          }
          EOF

      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-metadata-${{ matrix.name }}
          path: /tmp/build-metadata/${{ matrix.name }}.json
          retention-days: 90

  # ─── Generate build index after all plugins are built ─────────────────────
  build-index:
    name: Generate Build Index
    needs: [build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all build metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/build-metadata
          pattern: build-metadata-*
          merge-multiple: true

      - name: Generate build index
        shell: bash
        run: |
          chmod +x scripts/generate-build-index.sh
          ./scripts/generate-build-index.sh /tmp/build-metadata build-index.json docs/build-index.md

      - name: Upload build index artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-index
          path: build-index.json
          retention-days: 90

      - name: Commit updated build index docs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/build-index.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update build index [skip ci]"
            git push
          fi
