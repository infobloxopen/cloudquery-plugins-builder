apiVersion: batch/v1
kind: Job
metadata:
  name: cloudquery-sync-postgresql
spec:
  template:
    spec:
      containers:
        - name: cloudquery
          image: ghcr.io/cloudquery/cloudquery:latest
          args: ["sync", "/config/cloudquery.yaml"]
          volumeMounts:
            - name: config
              mountPath: /config
          envFrom:
            - secretRef:
                name: cloudquery-postgresql-secrets
      volumes:
        - name: config
          configMap:
            name: cloudquery-sync-postgresql-config
      restartPolicy: Never
  backoffLimit: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudquery-sync-postgresql-config
data:
  cloudquery.yaml: |
    kind: destination
    spec:
      name: postgresql
      registry: grpc
      path: cloudquery-plugin-postgresql:7777
      spec:
        connection_string: "${PG_CONNECTION_STRING}"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudquery-postgresql-secrets
type: Opaque
stringData:
  PG_CONNECTION_STRING: "postgresql://user:password@host:5432/dbname?sslmode=require"
