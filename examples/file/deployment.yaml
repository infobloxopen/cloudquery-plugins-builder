apiVersion: apps/v1
kind: Deployment
metadata:
  name: cq-destination-file
  labels:
    app: cq-destination-file
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cq-destination-file
  template:
    metadata:
      labels:
        app: cq-destination-file
    spec:
      containers:
        - name: plugin
          image: ghcr.io/infobloxopen/cq-destination-file:v5.5.1
          ports:
            - containerPort: 7777
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7777
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: output
              mountPath: /output
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: output
          persistentVolumeClaim:
            claimName: cloudquery-file-output
---
apiVersion: v1
kind: Service
metadata:
  name: cq-destination-file
spec:
  selector:
    app: cq-destination-file
  ports:
    - port: 7777
      targetPort: 7777
      protocol: TCP
