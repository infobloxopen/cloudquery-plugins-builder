apiVersion: batch/v1
kind: Job
metadata:
  name: cloudquery-sync-s3
spec:
  template:
    spec:
      containers:
        - name: cloudquery
          image: ghcr.io/cloudquery/cloudquery:latest
          args: ["sync", "/config/cloudquery.yaml"]
          volumeMounts:
            - name: config
              mountPath: /config
          env:
            - name: AWS_REGION
              value: "us-east-1"
          envFrom:
            - secretRef:
                name: cloudquery-s3-secrets
      volumes:
        - name: config
          configMap:
            name: cloudquery-sync-s3-config
      restartPolicy: Never
  backoffLimit: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudquery-sync-s3-config
data:
  cloudquery.yaml: |
    kind: destination
    spec:
      name: s3
      registry: grpc
      path: cloudquery-plugin-s3:7777
      spec:
        bucket: "my-cloudquery-bucket"
        region: "us-east-1"
        format: "parquet"
        path: "cloudquery/{{TABLE}}/{{UUID}}.parquet"
